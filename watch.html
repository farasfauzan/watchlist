<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08080a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Watch</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="watch">
<div class="topbar">
  <h1 id="ttl">Memuat…</h1>
  <button class="btn" id="prev" title="Sebelumnya">&laquo;</button>
  <button class="btn" id="next" title="Berikutnya">&raquo;</button>
  <button class="btn" id="list" title="Daftar episode">&#9776;</button>
  <button class="btn" id="dl" title="Download">&#10515;</button>
  <span class="badge" id="badge">siap</span>
  <span class="spacer"></span>
  <select id="season" hidden></select>
</div>
<div class="stage">
  <video id="v" controls playsinline preload="metadata"></video>
  <div class="pick" id="pick"></div>
  <div class="dlp" id="dlp">
    <h2 id="dlt">Download</h2>
    <div class="dlq" id="dlq"></div>
    <div class="dlrow">
      
    </div>
    <p class="dlnote" id="dlnote">Pilih kualitas, link-nya langsung dicopy.</p>
    <div class="dlbar" id="dlbar"><i></i></div>
    <button class="btn" id="dlclose">Tutup</button>
  </div>
  <div class="ovl" id="ovl"><div class="spin"></div><div id="msg">Menyiapkan…</div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script>
/* ---- title catalog ---- */
var SHOWS = {
  "loki":         {name:"Loki", tmdb:84958, seasons:{1:6, 2:6}},
  "breaking-bad": {name:"Breaking Bad", tmdb:1396, seasons:{1:7, 2:13, 3:13, 4:13, 5:16}},
  "john-wick-4":  {name:"John Wick: Chapter 4", movie:603692},
};

/* ---- read the request ---- */
var P = new URLSearchParams(location.search);
var slug = P.get("show") || "loki";
var S = SHOWS[slug] || SHOWS.loki;
var ep = Math.max(1, Number(P.get("e")) || 1);
var seas = Number(P.get("s")) || (S.seasons ? Number(Object.keys(S.seasons)[0]) : 0);

var v = document.getElementById("v");
var ovl = document.getElementById("ovl");
var msg = document.getElementById("msg");
var badge = document.getElementById("badge");
var pick = document.getElementById("pick");
var sel = document.getElementById("season");
var hls = null, retried = false;

function say(t){ msg.textContent = t; }
function showOvl(t){ say(t); ovl.classList.remove("hide"); }
function hideOvl(){ ovl.classList.add("hide"); }
function setBadge(t){ badge.textContent = t; }
function total(){ return S.movie ? 1 : S.seasons[seas]; }
function isMovie(){ return !!S.movie; }

/* ---- CDN token ----
   generate.php mints a JWT: 4 h TTL, bound to the caller's /24, valid for every
   episode and every mirror. It sits behind a tight per-IP limiter that answers
   429 with NO CORS headers — and a CORS-less response is precisely the opaque
   "Load failed" Safari shows. So mint once, keep it, and never ask again until
   it expires. That turns ~1 request per tap into ~1 request per 4 hours. */
var TOKKEY = "wl_tok";
var HOSTKEY = "wl_host";

function jwtExp(t){
  try {
    var p = t.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
    return JSON.parse(atob(p + "===".slice((p.length + 3) % 4))).exp - 60;
  } catch (e) { return Math.floor(Date.now() / 1e3) + 10800; }
}
function tokRead(){
  try {
    var s = JSON.parse(localStorage.getItem(TOKKEY) || "null");
    return (s && s.exp > Date.now() / 1e3) ? s.t : null;
  } catch (e) { return null; }
}
function tokWrite(t){ try { localStorage.setItem(TOKKEY, JSON.stringify({t: t, exp: jwtExp(t)})); } catch (e) {} }

function mintToken(host, quiet){
  var wait = [0, 6000, 15000];
  var i = 0;
  function attempt(){
    return fetch(host + "/generate.php", {credentials: "omit"}).then(function(r){
      return r.text().then(function(t){
        t = t.trim();
        if (r.ok && t.split(".").length === 3) { tokWrite(t); return t; }
        return null;
      });
    }).catch(function(){ return null; }).then(function(t){
      if (t) return t;
      i++;
      if (i >= wait.length) return null;
      if (!quiet) say("Server token penuh — ulang dalam " + (wait[i] / 1000) + " detik…");
      return new Promise(function(res){ setTimeout(res, wait[i]); }).then(attempt);
    });
  }
  return attempt();
}

async function getToken(host){
  var c = tokRead();
  if (c) return c;
  var t = await mintToken(host, false);
  if (!t) throw new Error("server token penuh — tap untuk ulang");
  return t;
}

/* ---- the ad-free chain ----
   1. data.vidsrc.sh API      -> encrypted stream_urls + per-window wasm
   2. wasm (ChaCha20)         -> plaintext array of HLS urls
   3. <host>/generate.php     -> cached per-IP token
   4. url?token=...           -> playable HLS, straight into <video>
   No wrapper page, no iframes, no ad networks. */
async function decrypt(vs, b64s) {
  var wb = await fetch(vs.wasm_url, {credentials:"omit"}).then(function(r){ return r.arrayBuffer(); });
  var inst = await WebAssembly.instantiate(await WebAssembly.compile(wb), {});
  var ex = inst.exports;
  var bin = atob(b64s), enc = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) enc[i] = bin.charCodeAt(i);
  var ptr = ex.alloc(enc.length);
  new Uint8Array(ex.memory.buffer, ptr, enc.length).set(enc);
  var n = ex.decrypt(ptr, enc.length);
  var txt = new TextDecoder().decode(new Uint8Array(ex.memory.buffer, ptr + 12, n));
  return txt.split("\n").filter(Boolean);
}

async function resolve(show, season, episode) {
  var q = show.movie
    ? "type=movie&tmdb=" + show.movie + "&stream_urls"
    : "type=tv&tmdb=" + show.tmdb + "&season=" + season + "&episode=" + episode + "&stream_urls";
  var j = await fetch("https://data.vidsrc.sh/api.php?" + q,
                      {credentials:"omit", headers:{accept:"application/json"}}).then(function(r){ return r.json(); });
  var u = j.data.stream_urls;
  if (j.vs && typeof u === "string") u = await decrypt(j.vs, u);
  if (!Array.isArray(u) || !u.length) throw new Error("no stream");
  var base = new URL(u[0]);
  try { localStorage.setItem(HOSTKEY, base.origin); } catch (e) {}
  window.__file = j.data.file_name || "";
  var tk = await getToken(base.origin);
  return u[0] + (u[0].indexOf("?") >= 0 ? "&" : "?") + "token=" + encodeURIComponent(tk);
}

/* hls.js reaches segments over XHR, and that CDN sends CORS headers for the
   playlists but not the segments — so desktop Chromium cannot do this at all.
   Safari plays HLS natively (no XHR, no CORS): that is why this page is for
   phones. Any fatal error downgrades to an embed link, never a black rectangle. */
function fail(why) {
  var link = isMovie()
    ? "https://vidsrc.to/embed/movie/" + S.movie
    : "https://vidsrc.to/embed/tv/" + S.tmdb + "/" + seas + "-" + ep;
  setBadge("cadangan");
  msg.innerHTML = "";
  msg.appendChild(document.createTextNode(why));
  msg.appendChild(document.createElement("br"));
  var a = document.createElement("a");
  a.href = link; a.textContent = "Buka lewat jalur cadangan \u2192";
  msg.appendChild(a);
  var n = document.createElement("div");
  n.style.cssText = "margin-top:10px;font-size:12px;color:#7c7c8a";
  n.textContent = "Tap layar ini buat ulang.";
  msg.appendChild(n);
  ovl.classList.remove("hide");
}

/* ---- download ----
   Measured: /pl/ and /generate.php allow cross-origin, but /content/ (the actual video
   segments) answers **403 with no CORS headers** for any request carrying an Origin
   header. A browser on another origin therefore CANNOT fetch the segments -- which is
   also why hls.js dies with fragLoadError while Safari's native player (no XHR, no
   Origin) plays fine. So there is no in-page "save to phone"; the honest options are
   the link below, or dl.py on a machine that is on this same network. */
var LASTURL = null;

function toggleDL(on){
  var el = document.getElementById("dlp");
  el.classList.toggle("on", on);
  if (!on || !LASTURL) return;
  document.getElementById("dlt").textContent = S.name + (isMovie() ? "" : " S" + seas + "E" + ep);
  fetch(LASTURL, {credentials:"omit"}).then(function(r){ return r.text(); }).then(function(t){
    var out = [];
    var lines = t.split("\n").filter(function(l){ return l.trim(); });
    for (var i = 0; i < lines.length; i++) {
      if (lines[i].indexOf("#EXT-X-STREAM-INF") !== 0) continue;
      var m = /RESOLUTION=(\d+)x(\d+)/.exec(lines[i]), b = /BANDWIDTH=(\d+)/.exec(lines[i]);
      if (m && lines[i+1]) out.push({h: +m[2], bw: b ? Math.round(b[1]/1000) : 0, u: lines[i+1].trim()});
    }
    out.sort(function(a,b){ return b.h - a.h; });
    var q = document.getElementById("dlq");
    q.innerHTML = "";
    if (!out.length) { document.getElementById("dlnote").textContent = "Sumber ini cuma satu kualitas."; return; }
    out.forEach(function(v){
      var btn = document.createElement("button");
      btn.className = "dlopt";
      btn.innerHTML = v.h + "p<em>" + (v.bw ? (v.bw / 1000).toFixed(1) + " Mbps" : "") + "</em>";
      btn.onclick = function(){ copyTo(host(v.u), btn); };
      q.appendChild(btn);
    });
    document.getElementById("dlnote").textContent = "Tap kualitas, link m3u8-nya dicopy. " + DL_HINT;
  }).catch(function(e){
    document.getElementById("dlnote").textContent = "Gagal baca kualitas: " + e.message;
  });
}
document.getElementById("dl").onclick = function(){ toggleDL(true); };
document.getElementById("dlclose").onclick = function(){ toggleDL(false); };
var DL_HINT = "Tempel di VLC / IDM / yt-dlp (1080p \u2248 0,6 GB per episode, hasil ukur).";
function host(u){ return u.indexOf("http") === 0 ? u : new URL(LASTURL).origin + u; }
function copyTo(u, btn){
  var done = function(){
    btn.classList.add("on");
    document.getElementById("dlnote").textContent = "Link " + btn.firstChild.textContent + " dicopy \u2192 tempel di VLC / IDM / yt-dlp.";
  };
  window.__lastcopy = u;
  if (navigator.clipboard) navigator.clipboard.writeText(u).then(done, function(){ prompt("Copy link:", u); });
  else prompt("Copy link:", u);
}

async function play() {
  var label = S.name + (isMovie() ? "" : " S" + seas + "E" + ep);
  retried = false;
  document.getElementById("ttl").textContent = label;
  document.title = label;
  if (hls) { try { hls.destroy(); } catch(e){} hls = null; }
  v.removeAttribute("src"); v.load();
  showOvl("Menyiapkan " + (isMovie() ? "film" : "episode " + ep) + "…");
  setBadge("menyambung");
  try {
    var url = await resolve(S, seas, ep);
    LASTURL = url;
    say("Buffering…");
    setBadge("1080p");
    var safari = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
                 (/Safari/.test(navigator.userAgent) && !/Chrome|Chromium|CriOS|Android|Edg/.test(navigator.userAgent));
    if (safari && v.canPlayType("application/vnd.apple.mpegurl")) {
      v.src = url;
    } else if (window.Hls && Hls.isSupported()) {
      hls = new Hls({enableWorker:true});
      hls.on(Hls.Events.ERROR, function(e, d) { if (d.fatal) fail("Gagal memuat (" + d.details + ")"); });
      hls.loadSource(url); hls.attachMedia(v);
    } else {
      throw new Error("HLS tidak didukung browser ini");
    }
    v.play().catch(function(){});
    try { localStorage.setItem("wl_last_" + slug, isMovie() ? "m" : seas + ":" + ep); } catch (e) {}
  } catch (err) {
    fail(err.message);
  }
}

/* the overlay is just a poster — tap it to retry, and hide it once frames arrive */
v.addEventListener("loadeddata", hideOvl);
v.addEventListener("playing", hideOvl);
ovl.addEventListener("click", function(e){ if (e.target.tagName !== "A") play(); });

/* a stale token (mobile handoff changed our /24) surfaces as a media error, not
   as a 4xx we can read — so drop the cached token and try exactly once more */
v.addEventListener("error", function(){
  if (retried || !v.getAttribute("src")) return;
  retried = true;
  try { localStorage.removeItem(TOKKEY); } catch (e) {}
  setTimeout(play, 1200);
});

/* warm the token while the user is still picking an episode */
if (!tokRead()) {
  try {
    var lh = localStorage.getItem(HOSTKEY);
    if (lh) mintToken(lh, true);
  } catch (e) {}
}

/* ---- episode / season UI ---- */
function paint() {
  var n = total();
  if (S.seasons) {
    var keys = Object.keys(S.seasons).map(Number).sort(function(a,b){ return a-b; });
    if (keys.length > 1 && !sel.options.length) {
      sel.hidden = false;
      keys.forEach(function(k){ sel.add(new Option("Season " + k, k)); });
    }
    sel.value = seas;
  }
  pick.innerHTML = "";
  for (var i = 1; i <= n; i++) {
    var a = document.createElement("a");
    a.href = "#" + i; a.textContent = i; a.dataset.n = i;
    if (i === ep) a.className = "cur";
    pick.appendChild(a);
  }
  if (n === 1) document.getElementById("list").hidden = true;
}
function go(n, s) {
  n = Math.max(1, Math.min(total(), n));
  if (s) seas = s;
  ep = n;
  history.replaceState(null, "", "?show=" + slug + (isMovie() ? "" : "&s=" + seas + "&e=" + ep));
  paint(); play();
}
pick.addEventListener("click", function(e){
  var a = e.target.closest("a[data-n]"); if (!a) return;
  e.preventDefault(); go(Number(a.dataset.n)); pick.classList.remove("on");
});
document.getElementById("list").onclick = function(){ pick.classList.toggle("on"); };
document.getElementById("prev").onclick = function(){ go(ep - 1); };
document.getElementById("next").onclick = function(){ go(ep + 1); };
sel.addEventListener("change", function(){ go(1, Number(sel.value)); });
document.addEventListener("keydown", function(e){
  if (e.key === "ArrowRight") go(ep + 1);
  if (e.key === "ArrowLeft") go(ep - 1);
});

/* resume where we left off */
if (!P.get("e")) {
  try {
    var last = localStorage.getItem("wl_last_" + slug);
    if (last && last !== "m") {
      var parts = last.split(":");
      if (S.seasons && S.seasons[Number(parts[0])]) { seas = Number(parts[0]); ep = Number(parts[1]); }
    }
  } catch (e) {}
}
paint();
play();
</script>
</body>
</html>
